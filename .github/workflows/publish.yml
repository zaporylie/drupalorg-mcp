name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing (OIDC) requires npm CLI >= 11.5.1. Pin to the
      # 11.x line rather than @latest so a future npm major bump (e.g. 12.x
      # requiring a newer Node than we run here) doesn't break this silently.
      - run: npm install -g npm@^11

      - run: npm install

      - run: node --check index.js

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # No NPM_TOKEN: npm exchanges this job's OIDC token (id-token: write, above)
      # for a short-lived publish token via npm's Trusted Publisher config.
      - run: npm publish --provenance --access public
